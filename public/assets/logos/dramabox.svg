<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="db_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5722"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="db_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="db_sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#db_bg)"/>
  <rect x="4" y="4" width="92" height="92" rx="24" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <!-- DramaBox Logo Mark -->
  <g filter="url(#db_sh)">
    <!-- Box outline -->
    <rect x="22" y="28" width="56" height="46" rx="10" fill="#ffffff"/>
    <!-- Clapper Stripe in Box Top -->
    <path d="M22 38 L78 38" stroke="url(#db_bg)" stroke-width="4"/>
    <line x1="34" y1="28" x2="30" y2="38" stroke="url(#db_bg)" stroke-width="3"/>
    <line x1="48" y1="28" x2="44" y2="38" stroke="url(#db_bg)" stroke-width="3"/>
    <line x1="62" y1="28" x2="58" y2="38" stroke="url(#db_bg)" stroke-width="3"/>
    <!-- Golden Play Triangle in Center -->
    <polygon points="45,46 61,56 45,66" fill="url(#db_bg)"/>
  </g>
</svg>