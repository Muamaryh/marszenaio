<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="id_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="id_sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#id_bg)"/>
  <rect x="4" y="4" width="92" height="92" rx="24" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <!-- iDrama Stylized 'i' + Play -->
  <g filter="url(#id_sh)">
    <!-- Lowercase 'i' dot -->
    <circle cx="34" cy="30" r="6" fill="#ffffff"/>
    <!-- Lowercase 'i' body -->
    <rect x="28" y="42" width="12" height="34" rx="4" fill="#ffffff"/>
    <!-- Bold Triangle Play -->
    <polygon points="52,36 78,54 52,72" fill="#ffffff"/>
  </g>
</svg>