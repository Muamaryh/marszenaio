<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="fl_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="fl_sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#fl_bg)"/>
  <rect x="4" y="4" width="92" height="92" rx="24" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <!-- Cinema Camera Film Flick -->
  <g filter="url(#fl_sh)">
    <rect x="22" y="32" width="38" height="38" rx="8" fill="#ffffff"/>
    <polygon points="64,38 80,28 80,74 64,64" fill="#ffffff"/>
    <circle cx="41" cy="51" r="9" fill="url(#fl_bg)"/>
    <polygon points="39,46 47,51 39,56" fill="#ffffff"/>
  </g>
</svg>