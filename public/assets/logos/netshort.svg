<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="ns_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="ns_red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff1e56"/>
      <stop offset="100%" stop-color="#b8002e"/>
    </linearGradient>
    <linearGradient id="ns_red_light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b72"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="ns_sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#ff1e56" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#ns_bg)"/>
  <rect x="4" y="4" width="92" height="92" rx="24" fill="none" stroke="rgba(255,30,86,0.3)" stroke-width="2"/>
  <!-- NetShort Iconic 3D Ribbon 'N' -->
  <g filter="url(#ns_sh)">
    <rect x="25" y="22" width="13" height="56" rx="2" fill="url(#ns_red)"/>
    <rect x="62" y="22" width="13" height="56" rx="2" fill="url(#ns_red)"/>
    <polygon points="25,22 38,22 75,78 62,78" fill="url(#ns_red_light)"/>
  </g>
</svg>