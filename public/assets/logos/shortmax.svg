  </defs>
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#sm_bg)"/>
  <rect x="4" y="4" width="92" height="92" rx="24" fill="none" stroke="rgba(251,146,60,0.25)" stroke-width="2"/>
