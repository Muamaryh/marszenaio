<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="ml_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="ml_sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#ca8a04" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#ml_bg)"/>
  <rect x="4" y="4" width="92" height="92" rx="24" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <!-- Melolo Cute Face Mark -->
  <g filter="url(#ml_sh)">
    <!-- Wink Left Eye -->
    <path d="M28 42 Q37 32 44 42" fill="none" stroke="#18181b" stroke-width="5" stroke-linecap="round"/>
    <!-- Big Right Eye -->
    <circle cx="64" cy="39" r="6.5" fill="#18181b"/>
    <circle cx="66" cy="37" r="2.5" fill="#ffffff"/>
    <!-- Joyful Smile -->
    <path d="M34 54 Q50 72 66 54" fill="none" stroke="#18181b" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Blush -->
    <ellipse cx="26" cy="52" rx="4.5" ry="3" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="74" cy="52" rx="4.5" ry="3" fill="#f43f5e" opacity="0.6"/>
  </g>
</svg>