<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="fr_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="fr_glow_g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#fr_bg)"/>
  <rect x="4" y="4" width="92" height="92" rx="24" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <!-- Film Reel Spool Outer -->
  <circle cx="50" cy="50" r="28" fill="none" stroke="#ffffff" stroke-width="5"/>
  <!-- Spool Holes -->
  <circle cx="50" cy="30" r="4.5" fill="url(#fr_glow_g)"/>
  <circle cx="67" cy="40" r="4.5" fill="url(#fr_glow_g)"/>
  <circle cx="67" cy="60" r="4.5" fill="url(#fr_glow_g)"/>
  <circle cx="50" cy="70" r="4.5" fill="url(#fr_glow_g)"/>
  <circle cx="33" cy="60" r="4.5" fill="url(#fr_glow_g)"/>
  <circle cx="33" cy="40" r="4.5" fill="url(#fr_glow_g)"/>
  <!-- Center Play -->
  <polygon points="45,40 60,50 45,60" fill="#ffffff"/>
</svg>