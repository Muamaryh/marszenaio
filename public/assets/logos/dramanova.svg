<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="dn_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="dn_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="dn_sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#dn_bg)"/>
  <rect x="4" y="4" width="92" height="92" rx="24" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <!-- Nova Diamond Star -->
  <g filter="url(#dn_sh)">
    <!-- 8 Point Nova Star -->
    <polygon points="50,18 56,40 78,40 60,52 67,74 50,60 33,74 40,52 22,40 44,40" fill="url(#dn_gold)"/>
    <circle cx="50" cy="48" r="5" fill="#ffffff"/>
  </g>
</svg>