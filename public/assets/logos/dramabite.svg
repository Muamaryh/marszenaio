<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="dbite_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="dbite_sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#dbite_bg)"/>
  <rect x="4" y="4" width="92" height="92" rx="24" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <!-- DramaBite Reel with Bite mark -->
  <g filter="url(#dbite_sh)">
    <!-- Film Reel Circle -->
    <circle cx="50" cy="52" r="26" fill="#ffffff"/>
    <!-- Bite Curve (subtract with background color) -->
    <circle cx="72" cy="40" r="14" fill="url(#dbite_bg)"/>
    <!-- Center Play -->
    <polygon points="42,42 56,52 42,62" fill="url(#dbite_bg)"/>
    <!-- Cherry Stem -->
    <path d="M50 26 Q56 16 66 18" stroke="#22c55e" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>