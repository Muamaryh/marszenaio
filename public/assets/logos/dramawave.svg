<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="dw_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="dw_wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>
    <filter id="dw_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#dw_bg)"/>
  <rect x="4" y="4" width="92" height="92" rx="24" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <!-- Wave ribbons -->
  <g filter="url(#dw_glow)">
    <path d="M22 62 C32 44 44 42 56 54 C66 64 76 56 80 48" fill="none" stroke="url(#dw_wave)" stroke-width="7" stroke-linecap="round"/>
    <path d="M20 48 C30 30 46 32 58 42 C68 50 74 44 80 36" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.9"/>
    <!-- Central Play -->
    <polygon points="46,38 64,50 46,62" fill="#ffffff"/>
  </g>
</svg>